<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>HTML 预览测试</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #1a1a1a; color: #eee; }
    .ok { color: #6d9; }
    .fail { color: #f66; }
    button { margin: 8px 8px 8px 0; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>HTML 预览功能自测</h1>
  <p id="result">运行中…</p>
  <button id="btnPreview">测试弹窗预览</button>
  <button id="btnTab">测试新标签页</button>
  <iframe id="frame" style="display:none"></iframe>

  <script>
    const SAMPLE = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>测试页</title>
  <style>body{background:#f3f4f6;color:#1f2937;padding:24px;font-family:sans-serif}h1{color:#4f46e5}</style>
</head>
<body>
  <h1>本地模型部署全景</h1>
  <p id="ok">预览渲染成功</p>
</body>
</html>`;

    function ensureHtmlDocument(html) {
      const trimmed = (html || "").trim();
      if (!trimmed) return "";
      if (/<!DOCTYPE\s+html/i.test(trimmed) || /^<html[\s>]/i.test(trimmed)) return trimmed;
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${trimmed}</body></html>`;
    }

    let blobUrl = null;

    function openPreview(html) {
      const doc = ensureHtmlDocument(html);
      const frame = document.getElementById("frame");
      frame.style.display = "block";
      frame.style.width = "100%";
      frame.style.height = "400px";
      frame.style.marginTop = "16px";
      frame.style.border = "1px solid #444";
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([doc], { type: "text/html;charset=utf-8" }));
      frame.src = blobUrl;
      return new Promise((resolve, reject) => {
        frame.onload = () => {
          try {
            const h1 = frame.contentDocument.querySelector("h1")?.textContent;
            const p = frame.contentDocument.querySelector("#ok")?.textContent;
            resolve({ h1, p });
          } catch (e) { reject(e); }
        };
        frame.onerror = reject;
      });
    }

    function openTab(html) {
      const doc = ensureHtmlDocument(html);
      const url = URL.createObjectURL(new Blob([doc], { type: "text/html;charset=utf-8" }));
      const win = window.open(url, "_blank");
      return !!win;
    }

    (async () => {
      const el = document.getElementById("result");
      try {
        const { h1, p } = await openPreview(SAMPLE);
        if (h1 === "本地模型部署全景" && p === "预览渲染成功") {
          el.innerHTML = '<span class="ok">✓ 弹窗预览逻辑正常（iframe + Blob URL）</span>';
        } else {
          el.innerHTML = `<span class="fail">✗ 内容不匹配: h1=${h1}, p=${p}</span>`;
        }
      } catch (e) {
        el.innerHTML = `<span class="fail">✗ 预览失败: ${e.message}</span>`;
      }

      document.getElementById("btnPreview").onclick = () => openPreview(SAMPLE);
      document.getElementById("btnTab").onclick = () => openTab(SAMPLE);
    })();
  </script>
</body>
</html>
