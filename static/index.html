<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>墨涧 · Qwen3 本地对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink-deep: #0a0908;
      --ink-mid: #141210;
      --ink-soft: #1e1c19;
      --paper: #e6ddd0;
      --paper-dim: #b8aea0;
      --vermillion: #c0392b;
      --vermillion-glow: #e85d4a;
      --jade: #4a6b5d;
      --jade-soft: #6d9482;
      --gold: #c9a227;
      --text-bright: #f4efe6;
      --text-muted: #8a8278;
      --border: rgba(230, 221, 208, 0.08);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      --font-display: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      --font-body: "Noto Serif SC", "Songti SC", serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--ink-deep);
      color: var(--text-bright);
      font-family: var(--font-body);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 10%, rgba(74,107,93,0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 90%, rgba(192,57,43,0.12), transparent 50%),
        radial-gradient(ellipse 100% 100% at 50% 50%, var(--ink-mid), var(--ink-deep));
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: "";
      position: fixed; inset: 0; opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ── Layout ── */
    .app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px; gap: 20px;
    }

    /* ── Sidebar ── */
    .sidebar {
      display: flex; flex-direction: column; gap: 12px;
      animation: slideIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 18px;
      background: var(--ink-soft);
      border: 1px solid var(--border);
      border-radius: 4px 24px 4px 24px;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .brand::before {
      content: "涧"; position: absolute; right: -8px; bottom: -20px;
      font-family: var(--font-display); font-size: 7rem;
      color: rgba(230,221,208,0.04); line-height: 1; pointer-events: none;
    }
    .brand-tag {
      display: inline-block; font-size: 0.65rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--jade-soft); margin-bottom: 8px;
    }
    .brand h1 {
      font-family: var(--font-display); font-size: 1.8rem; font-weight: 400;
      letter-spacing: 0.15em; color: var(--paper); margin-bottom: 4px;
    }
    .brand p { font-size: 0.78rem; line-height: 1.6; color: var(--text-muted); }

    /* ── Auth area ── */
    .auth-panel {
      padding: 14px 16px;
      background: var(--ink-soft);
      border: 1px solid var(--border);
      border-radius: 4px; flex-shrink: 0;
    }
    .auth-label {
      font-size: 0.68rem; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 8px;
    }
    .auth-input {
      width: 100%; padding: 7px 10px;
      background: var(--ink-mid); border: 1px solid var(--border);
      border-radius: 3px; color: var(--paper);
      font-family: var(--font-body); font-size: 0.82rem; outline: none;
      margin-bottom: 8px;
    }
    .auth-input:focus { border-color: rgba(74,107,93,0.5); }
    .auth-input::placeholder { color: var(--text-muted); }
    .auth-btns { display: flex; gap: 8px; }
    .btn-auth {
      flex: 1; padding: 7px 0;
      background: transparent; border: 1px solid var(--border);
      color: var(--paper-dim); font-family: var(--font-body); font-size: 0.78rem;
      letter-spacing: 0.08em; border-radius: 2px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-auth:hover { background: rgba(74,107,93,0.15); border-color: var(--jade); color: var(--paper); }
    .btn-auth.primary { border-color: rgba(192,57,43,0.45); color: var(--vermillion-glow); }
    .btn-auth.primary:hover { background: rgba(192,57,43,0.15); border-color: var(--vermillion); color: var(--paper); }

    .user-panel {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .user-name { font-size: 0.82rem; color: var(--jade-soft); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout {
      padding: 5px 10px; background: transparent;
      border: 1px solid rgba(192,57,43,0.3); color: var(--text-muted);
      font-family: var(--font-body); font-size: 0.72rem; border-radius: 2px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover { background: rgba(192,57,43,0.12); border-color: var(--vermillion); color: var(--vermillion-glow); }

    /* ── Status ── */
    .status-card {
      padding: 12px 16px; background: var(--ink-soft);
      border: 1px solid var(--border); border-radius: 4px; flex-shrink: 0;
    }
    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
      flex-shrink: 0; transition: background 0.4s, box-shadow 0.4s;
    }
    .status-dot.online { background: var(--jade-soft); box-shadow: 0 0 12px rgba(109,148,130,0.6); }
    .status-dot.offline { background: var(--vermillion); box-shadow: 0 0 12px rgba(192,57,43,0.5); }
    .status-dot.loading { background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
    .status-label { font-size: 0.78rem; color: var(--paper-dim); }
    .status-detail { font-size: 0.7rem; color: var(--text-muted); line-height: 1.5; word-break: break-all; }

    /* ── New conv btn ── */
    .btn-new-conv {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; flex-shrink: 0;
      background: rgba(74,107,93,0.12);
      border: 1px solid rgba(74,107,93,0.3);
      color: var(--jade-soft); font-family: var(--font-body);
      font-size: 0.82rem; letter-spacing: 0.08em;
      border-radius: 3px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-new-conv:hover { background: rgba(74,107,93,0.22); border-color: var(--jade); color: var(--paper); }
    .btn-new-conv svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    /* ── Conversation list ── */
    .conv-list-wrap {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      background: var(--ink-soft); border: 1px solid var(--border); border-radius: 4px;
    }
    .conv-list-wrap::-webkit-scrollbar { width: 3px; }
    .conv-list-wrap::-webkit-scrollbar-track { background: transparent; }
    .conv-list-wrap::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 2px; }

    #convList { padding: 6px; }

    .conv-group-label {
      font-size: 0.65rem; letter-spacing: 0.12em;
      color: var(--text-muted); padding: 10px 10px 4px;
      text-transform: uppercase;
    }

    .conv-item {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 10px; border-radius: 3px; cursor: pointer;
      transition: background 0.18s; position: relative;
    }
    .conv-item:hover { background: rgba(230,221,208,0.06); }
    .conv-item.active { background: rgba(74,107,93,0.18); }
    .conv-item-title {
      flex: 1; font-size: 0.8rem; color: var(--paper-dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .conv-item.active .conv-item-title { color: var(--paper); }
    .conv-item-action {
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--text-muted);
      border-radius: 3px; cursor: pointer; flex-shrink: 0; opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .conv-item:hover .conv-item-action { opacity: 1; }
    .conv-item-action:hover { background: rgba(230,221,208,0.1); color: var(--paper); }
    .conv-item-del:hover { color: var(--vermillion-glow) !important; }
    .conv-item-action svg { width: 13px; height: 13px; fill: currentColor; }

    /* ── Controls ── */
    .controls {
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px 16px; background: var(--ink-soft);
      border: 1px solid var(--border); border-radius: 4px; flex-shrink: 0;
    }
    .control-label { font-size: 0.7rem; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 4px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0; background: var(--ink-mid);
      border: 1px solid var(--border); border-radius: 12px;
      transition: background 0.3s, border-color 0.3s;
    }
    .toggle input:checked + .toggle-track { background: rgba(74,107,93,0.4); border-color: var(--jade); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      background: var(--paper-dim); border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), background 0.3s;
    }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(20px); background: var(--jade-soft); }

    input[type="range"] {
      width: 100%; -webkit-appearance: none; height: 3px;
      background: var(--ink-mid); border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--vermillion); border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 8px rgba(192,57,43,0.5);
    }
    .range-value { font-size: 0.75rem; color: var(--gold); text-align: right; margin-top: 4px; }

    /* ── Main chat ── */
    .main {
      display: flex; flex-direction: column;
      background: var(--ink-soft); border: 1px solid var(--border);
      border-radius: 24px 4px 24px 4px; box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .chat-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .chat-header h2 {
      font-family: var(--font-display); font-size: 1.05rem; font-weight: 400;
      letter-spacing: 0.2em; color: var(--paper);
    }
    .chat-header span { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.05em; }

    /* ── Messages ── */
    .messages {
      flex: 1; overflow-y: auto; padding: 24px; padding-bottom: 16px;
      display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 2px; }

    /* ── Welcome ── */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; text-align: center; padding: 40px 20px; animation: fadeUp 0.6s ease both;
    }
    .welcome-seal {
      width: 64px; height: 64px; border: 2px solid var(--vermillion); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 2rem; color: var(--vermillion);
      margin-bottom: 20px; transform: rotate(-3deg); box-shadow: 0 0 30px rgba(192,57,43,0.2);
    }
    .welcome h3 { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 0.15em; color: var(--paper); margin-bottom: 10px; }
    .welcome p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; max-width: 320px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
    .suggestion {
      padding: 8px 14px; background: rgba(230,221,208,0.05);
      border: 1px solid var(--border); border-radius: 2px 12px 2px 12px;
      font-size: 0.78rem; color: var(--paper-dim); cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .suggestion:hover { background: rgba(74,107,93,0.2); color: var(--paper); border-color: rgba(74,107,93,0.4); }

    /* ── Messages ── */
    .msg { display: flex; gap: 14px; animation: msgIn 0.45s cubic-bezier(0.16,1,0.3,1) both; position: relative; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 0.85rem; align-self: flex-start;
    }
    .msg.user .msg-avatar { background: rgba(192,57,43,0.2); border: 1px solid rgba(192,57,43,0.4); color: var(--vermillion-glow); }
    .msg.assistant .msg-avatar { background: rgba(74,107,93,0.25); border: 1px solid rgba(74,107,93,0.45); color: var(--jade-soft); }
    .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 6px; }
    .msg-meta { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.08em; }
    .msg.user .msg-meta { text-align: right; }

    .msg-content {
      padding: 13px 16px; font-size: 0.9rem; line-height: 1.85;
      border-radius: 4px 16px 4px 16px; word-break: break-word;
    }
    .msg.user .msg-content {
      white-space: pre-wrap; background: rgba(192,57,43,0.12);
      border: 1px solid rgba(192,57,43,0.2); border-radius: 16px 4px 16px 4px; color: var(--paper);
    }
    .msg.assistant .msg-content { background: rgba(230,221,208,0.05); border: 1px solid var(--border); color: var(--text-bright); }
    .msg.assistant.streaming .msg-content { border-color: rgba(74,107,93,0.35); }

    /* Markdown */
    .msg-content .md-body > :first-child { margin-top: 0; }
    .msg-content .md-body > :last-child { margin-bottom: 0; }
    .msg-content .md-body p { margin: 0.6em 0; }
    .msg-content .md-body h1,.msg-content .md-body h2,.msg-content .md-body h3,.msg-content .md-body h4 {
      font-family: var(--font-display); color: var(--paper); margin: 1em 0 0.5em; line-height: 1.4;
    }
    .msg-content .md-body h1 { font-size: 1.25rem; }
    .msg-content .md-body h2 { font-size: 1.1rem; }
    .msg-content .md-body h3 { font-size: 1rem; }
    .msg-content .md-body ul,.msg-content .md-body ol { margin: 0.5em 0; padding-left: 1.4em; }
    .msg-content .md-body li { margin: 0.25em 0; }
    .msg-content .md-body blockquote { margin: 0.6em 0; padding: 0.4em 0 0.4em 0.9em; border-left: 3px solid var(--jade); color: var(--paper-dim); }
    .msg-content .md-body code { font-family: "Cascadia Code","Consolas",monospace; font-size: 0.85em; background: rgba(10,9,8,0.45); padding: 0.15em 0.4em; border-radius: 3px; color: var(--gold); }
    .msg-content .md-body pre { margin: 0.75em 0; padding: 14px 16px; background: rgba(10,9,8,0.55); border: 1px solid var(--border); border-radius: 4px; overflow-x: auto; line-height: 1.6; }
    .msg-content .md-body pre code { background: none; padding: 0; color: var(--text-bright); font-size: 0.82em; }
    .msg-content .md-body a { color: var(--jade-soft); text-decoration: underline; text-underline-offset: 2px; }
    .msg-content .md-body a:hover { color: var(--paper); }
    .msg-content .md-body table { width: 100%; border-collapse: collapse; margin: 0.75em 0; font-size: 0.85em; }
    .msg-content .md-body th,.msg-content .md-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .msg-content .md-body th { background: rgba(74,107,93,0.2); color: var(--paper); }
    .msg-content .md-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

    /* Thinking */
    .thinking-block { margin-bottom: 12px; padding: 10px 12px; background: rgba(201,162,39,0.06); border-left: 2px solid var(--gold); border-radius: 0 4px 4px 0; font-size: 0.8rem; line-height: 1.7; color: var(--paper-dim); font-style: italic; }
    .thinking-label { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--gold); margin-bottom: 4px; font-style: normal; }

    /* Streaming */
    .stream-text::after { content: "▍"; color: var(--jade-soft); animation: blink 1s step-end infinite; margin-left: 1px; }

    /* Interrupted badge */
    .interrupted-badge { display: inline-block; margin-top: 6px; font-size: 0.72rem; color: var(--text-muted); font-style: italic; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; padding: 14px 16px; align-items: center; }
    .typing-indicator span { width: 6px; height: 6px; background: var(--jade-soft); border-radius: 50%; animation: typing 1.2s ease-in-out infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Message action bar ── */
    .msg-actions {
      display: flex; gap: 4px; opacity: 0;
      transition: opacity 0.18s;
    }
    .msg.user .msg-actions { justify-content: flex-end; }
    .msg:hover .msg-actions { opacity: 1; }
    .msg-action-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 3px; cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }
    .msg-action-btn:hover { background: rgba(230,221,208,0.1); color: var(--paper); border-color: rgba(230,221,208,0.2); }
    .msg-action-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Input area ── */
    .input-area { padding: 16px 20px 20px; border-top: 1px solid var(--border); background: rgba(10,9,8,0.4); flex-shrink: 0; }
    .input-wrap { display: flex; gap: 10px; align-items: flex-end; }
    .input-field { flex: 1; position: relative; }
    textarea {
      width: 100%; min-height: 52px; max-height: 160px; padding: 14px 16px;
      background: var(--ink-mid); border: 1px solid var(--border);
      border-radius: 4px 16px 4px 16px; color: var(--paper);
      font-family: var(--font-body); font-size: 0.9rem; line-height: 1.6;
      resize: none; outline: none; transition: border-color 0.25s, box-shadow 0.25s;
    }
    textarea:focus { border-color: rgba(74,107,93,0.5); box-shadow: 0 0 0 3px rgba(74,107,93,0.12); }
    textarea::placeholder { color: var(--text-muted); }

    .btn-send, .btn-stop {
      width: 52px; height: 52px; flex-shrink: 0; border: none; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-send {
      background: var(--vermillion);
      box-shadow: 0 4px 20px rgba(192,57,43,0.35);
    }
    .btn-send:hover:not(:disabled) { background: var(--vermillion-glow); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(192,57,43,0.45); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .btn-send svg { width: 20px; height: 20px; fill: var(--paper); }

    .btn-stop {
      background: rgba(192,57,43,0.2); border: 1px solid rgba(192,57,43,0.5);
    }
    .btn-stop:hover { background: rgba(192,57,43,0.35); }
    .btn-stop svg { width: 18px; height: 18px; fill: var(--vermillion-glow); }

    .input-hint { margin-top: 8px; font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.05em; }

    /* ── HTML code block preview ── */
    .code-block-wrap { margin: 0.75em 0; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: rgba(10,9,8,0.55); }
    .code-block-wrap pre { margin: 0; border: none; border-radius: 0; background: transparent; }
    .code-block-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; background: rgba(74,107,93,0.15); border-bottom: 1px solid var(--border); }
    .code-block-lang { font-size: 0.68rem; letter-spacing: 0.12em; color: var(--jade-soft); text-transform: uppercase; }
    .code-block-actions { display: flex; gap: 8px; }
    .btn-code-action { padding: 4px 10px; background: transparent; border: 1px solid rgba(74,107,93,0.45); color: var(--jade-soft); font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.06em; border-radius: 2px; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .btn-code-action:hover { background: rgba(74,107,93,0.25); border-color: var(--jade); color: var(--paper); }
    .btn-code-action.primary { border-color: rgba(192,57,43,0.45); color: var(--vermillion-glow); }
    .btn-code-action.primary:hover { background: rgba(192,57,43,0.15); border-color: var(--vermillion); color: var(--paper); }

    /* ── HTML Preview Modal ── */
    .html-preview-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .html-preview-modal.open { display: flex; }
    .html-preview-backdrop { position: absolute; inset: 0; background: rgba(10,9,8,0.75); backdrop-filter: blur(4px); }
    .html-preview-dialog { position: relative; z-index: 1; display: flex; flex-direction: column; width: min(90vw,1200px); height: 85vh; background: var(--ink-soft); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; animation: fadeUp 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .html-preview-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(10,9,8,0.4); }
    .html-preview-title { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.12em; color: var(--paper); }
    .html-preview-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--paper-dim); font-size: 1.2rem; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .html-preview-close:hover { background: rgba(192,57,43,0.15); border-color: rgba(192,57,43,0.4); color: var(--vermillion-glow); }
    .html-preview-frame { flex: 1; width: 100%; border: none; background: #fff; }

    /* ── Error toast ── */
    .error-toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 22px; background: rgba(192,57,43,0.9);
      color: var(--paper); font-size: 0.82rem; border-radius: 4px;
      z-index: 300; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); pointer-events: none;
    }
    .error-toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Hamburger ── */
    .hamburger-btn {
      display: none; position: fixed; top: 16px; left: 16px; z-index: 150;
      width: 40px; height: 40px; background: var(--ink-soft); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; align-items: center; justify-content: center; flex-direction: column; gap: 5px;
    }
    .hamburger-btn span { display: block; width: 18px; height: 2px; background: var(--paper-dim); border-radius: 1px; transition: background 0.2s; }
    .hamburger-btn:hover span { background: var(--paper); }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0; z-index: 99;
      background: rgba(10,9,8,0.6); backdrop-filter: blur(2px);
    }
    .sidebar-overlay.show { display: block; }

    /* ── Animations ── */
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; padding: 0; }
      .hamburger-btn { display: flex; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
        z-index: 100; padding: 16px; background: var(--ink-deep);
        transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
      }
      .sidebar.open { transform: translateX(0); }
      .main { border-radius: 0; height: 100vh; padding-top: 0; }
      .chat-header { padding-left: 64px; }
      .msg-body { max-width: 88%; }
    }
  </style>
</head>
<body>
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-tag">Local · ModelScope</div>
        <h1>墨涧工坊</h1>
        <p>Qwen3.5-0.8B 本地推理<br />数据不出本机</p>
      </div>

      <!-- 认证区 -->
      <div class="auth-panel" id="authSection">
        <div class="auth-label">用户名登录 / 注册</div>
        <input class="auth-input" id="usernameInput" type="text" placeholder="输入用户名（2-32字符）" maxlength="32" />
        <div class="auth-btns">
          <button class="btn-auth primary" id="registerBtn">注册</button>
          <button class="btn-auth" id="loginBtn">登录</button>
        </div>
      </div>
      <div class="auth-panel" id="userSection" style="display:none">
        <div class="user-panel">
          <span class="user-name" id="currentUser"></span>
          <button class="btn-logout" id="logoutBtn">退出</button>
        </div>
      </div>

      <!-- 状态 -->
      <div class="status-card">
        <div class="status-row">
          <div class="status-dot loading" id="statusDot"></div>
          <span class="status-label" id="statusLabel">连接中…</span>
        </div>
        <div class="status-detail" id="statusDetail">正在检测模型服务</div>
      </div>

      <!-- 新对话 -->
      <button class="btn-new-conv" id="newConvBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        新对话
      </button>

      <!-- 对话列表 -->
      <div class="conv-list-wrap">
        <div id="convList"></div>
      </div>

      <!-- 参数控制 -->
      <div class="controls">
        <div>
          <div class="toggle-row">
            <span class="control-label">思考模式</span>
            <label class="toggle">
              <input type="checkbox" id="thinkingToggle" />
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
        </div>
        <div>
          <div class="control-label">最大生成长度</div>
          <input type="range" id="maxTokens" min="64" max="2048" step="64" value="512" />
          <div class="range-value" id="maxTokensValue">512 tokens</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <h2 id="chatTitle">对话</h2>
        <span id="modelBadge">Qwen3.5-0.8B · CPU</span>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-seal">问</div>
          <h3>开始对话</h3>
          <p>模型运行在你的本机上。<br />输入问题，即刻获得回复。</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="用三句话介绍你自己">自我介绍</button>
            <button class="suggestion" data-prompt="写一首关于春天的五言绝句">写诗</button>
            <button class="suggestion" data-prompt="生成一段精简的HTML页面，要有标题、一段介绍文字和一个按钮">生成HTML</button>
            <button class="suggestion" data-prompt="9.11和9.8哪个大？">逻辑推理</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrap">
          <div class="input-field">
            <textarea id="input" placeholder="输入你的问题…" rows="1" autofocus></textarea>
          </div>
          <button class="btn-send" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
          <button class="btn-stop" id="stopBtn" title="停止生成" style="display:none">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>
        <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 流式输出</div>
      </div>
    </main>
  </div>

  <!-- HTML Preview Modal -->
  <div class="html-preview-modal" id="htmlPreviewModal" aria-hidden="true">
    <div class="html-preview-backdrop" id="htmlPreviewBackdrop"></div>
    <div class="html-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="htmlPreviewTitle">
      <header class="html-preview-header">
        <span class="html-preview-title" id="htmlPreviewTitle">HTML 预览</span>
        <button type="button" class="html-preview-close" id="htmlPreviewClose" title="关闭" aria-label="关闭预览">×</button>
      </header>
      <iframe id="htmlPreviewFrame" class="html-preview-frame" title="HTML 预览内容" sandbox="allow-scripts allow-popups allow-modals"></iframe>
    </div>
  </div>

  <div class="error-toast" id="errorToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
